[versions]
paper = "26.3.build.253-stable"
fancynpcs = "2.11.0"
placeholderapi = "2.12.3"
hikari = "7.1.0"
sqlite = "3.54.1.0"
mariadb = "3.5.11"
junit = "6.1.3"
shadow = "9.6.1"
run-paper = "3.1.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
fancynpcs = { module = "de.oliver:FancyNpcs", version.ref = "fancynpcs" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
mariadb-jdbc = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
